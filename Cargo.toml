[workspace]
resolver = "2"
members = ["contracts/institutional-account", "contracts/webauthn-verifier"]

[workspace.dependencies]
soroban-sdk = "=26.1.0"
stellar-accounts = "=0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
